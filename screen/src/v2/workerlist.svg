<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 852" width="100%" height="100%">
  <defs>
    <filter id="v2wl-device-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="v2wl-card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#141410" flood-opacity="0.04" />
    </filter>
    <clipPath id="v2wl-screen-clip">
      <rect x="20" y="20" width="375" height="812" rx="40" />
    </clipPath>
    <clipPath id="v2wl-avatar-clip">
      <circle cx="56" cy="76" r="30" />
    </clipPath>
  </defs>

  <!-- Hardware -->
  <rect x="10" y="10" width="395" height="832" rx="50" fill="#111111" filter="url(#v2wl-device-shadow)" />
  <rect x="20" y="20" width="375" height="812" rx="40" fill="#F7F7F5" />
  
  <path d="M8 150 h2 v24 h-2 z" fill="#333333" />
  <path d="M8 190 h2 v48 h-2 z" fill="#333333" />
  <path d="M8 250 h2 v48 h-2 z" fill="#333333" />
  <path d="M405 220 h2 v72 h-2 z" fill="#333333" />

  <!-- Screen Content -->
  <g clip-path="url(#v2wl-screen-clip)">
    <!-- Background -->
    <rect x="20" y="20" width="375" height="812" fill="#F7F7F5" />
    
    <!-- Status Bar -->
    <g transform="translate(20, 20)">
      <text x="32" y="32" font-family="-apple-system, sans-serif" fill="#1A1A18" font-size="15" font-weight="600" text-anchor="middle">14:47</text>
      <rect x="126" y="11" width="123" height="35" rx="17.5" fill="#000000" />
      <g transform="translate(290, 17)" fill="#1A1A18">
        <g transform="translate(0, 0)">
          <rect x="0" y="8" width="3" height="4" rx="1" /><rect x="4" y="6" width="3" height="6" rx="1" /><rect x="8" y="4" width="3" height="8" rx="1" /><rect x="12" y="2" width="3" height="10" rx="1" />
        </g>
        <g transform="translate(20, 0)">
          <path d="M8 12.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" /><path d="M3.5 8C6.1 5.4 9.9 5.4 12.5 8l-1.5 1.5C9.4 7.9 6.6 7.9 5 9.5L3.5 8z" /><path d="M0.5 5C4.7 1.2 11.3 1.2 15.5 5l-1.5 1.5c-3.4-3-8.6-3-12 0L0.5 5z" />
        </g>
        <g transform="translate(42, 1)">
          <rect x="0" y="0" width="22" height="11" rx="3.5" fill="none" stroke="#1A1A18" stroke-width="1.2" /><rect x="2" y="2" width="15" height="7" rx="2" /><path d="M23.5 3.5v4" stroke="#1A1A18" stroke-width="1.5" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- Header & Search Context -->
    <g transform="translate(20, 90)">
      <!-- Back button -->
      <g id="back-btn-workerlist" style="cursor:pointer;">
        <circle cx="36" cy="24" r="20" fill="#FFFFFF" filter="url(#v2wl-card-shadow)" />
        <path d="M20 12h-8M16 8l-4 4 4 4" fill="none" stroke="#1A1A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(24, 12)" />
      </g>
      
      <!-- Search Summary Pill -->
      <g transform="translate(64, 4)">
        <rect width="247" height="40" rx="20" fill="#FFFFFF" filter="url(#v2wl-card-shadow)" />
        <!-- Search icon -->
        <circle cx="20" cy="20" r="14" fill="#EFF6FF" />
        <path d="M11 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM21 21l-4.3-4.3" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(8, 8) scale(0.6)" />
        <text x="44" y="25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#1A1A18">Plumber</text>
        <circle cx="106" cy="20" r="2" fill="#8C8A82" />
        <text x="116" y="25" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#8C8A82">Sanjay Gandhi...</text>
      </g>
      
      <!-- Filter Button -->
      <g transform="translate(319, 4)">
        <rect width="40" height="40" rx="20" fill="#FFFFFF" filter="url(#v2wl-card-shadow)" />
        <path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M8 16v4" fill="none" stroke="#1A1A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(8, 8) scale(0.6)" />
      </g>
    </g>

    <!-- Scrollable Body -->
    <g id="scrollable-content-workerlist" transform="translate(0, 0)">

    <!-- Quick Filters -->
    <g transform="translate(36, 154)">
      <rect x="0" y="0" width="82" height="32" rx="16" fill="#1A1A18" />
      <text x="41" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Top Rated</text>
      
      <rect x="90" y="0" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1" />
      <text x="137" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#5B5A54" text-anchor="middle">Nearest first</text>
      
      <rect x="192" y="0" width="112" height="32" rx="16" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1" />
      <text x="248" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#5B5A54" text-anchor="middle">Verified Pro ✓</text>
    </g>
    
    <!-- Title -->
    <text x="36" y="230" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#1A1A18">14 Plumbers nearby</text>

    <!-- Map Snippet Button -->
    <g transform="translate(36, 250)">
      <rect width="343" height="48" rx="12" fill="#E8F6EC" />
      <text x="171.5" y="29" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#1FA34C" text-anchor="middle">🗺️ View workers on Map</text>
    </g>

    <!-- Worker List -->
    <g transform="translate(36, 314)">
      
      <!-- Worker Card 1 -->
      <g id="workerlist-card-1" style="cursor:pointer;">
        <rect x="0" y="0" width="343" height="124" rx="20" fill="#FFFFFF" filter="url(#v2wl-card-shadow)" />
        
        <g transform="translate(16, 16)"><clipPath id="v2wl-avatar-clip-1"><rect width="60" height="60" rx="30"/></clipPath><image href="https://images.unsplash.com/photo-1540569014015-19a7be504e3a?w=150&amp;h=150&amp;fit=crop" width="60" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#v2wl-avatar-clip-1)" /></g>
        <!-- Verification Badge -->
        <circle cx="76" cy="86" r="10" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" transform="translate(-20, -20)" />
        <path d="M4 8l2 2 4-4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(51, 61) scale(0.8)" />
        
        <text x="96" y="34" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#1A1A18">Prayag Ahire</text>
        <text x="96" y="54" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#5B5A54">Expert Plumber • 8 yrs exp</text>
        
        <!-- Info Badges -->
        <g transform="translate(96, 68)">
          <!-- Rating -->
          <rect x="0" y="0" width="58" height="26" rx="8" fill="#FFFBEB" />
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="#F59E0B" transform="translate(4, 5) scale(0.6)" />
          <text x="24" y="17" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400E">4.8</text>
          
          <!-- Distance -->
          <rect x="66" y="0" width="68" height="26" rx="8" fill="#F3F4F6" />
          <text x="100" y="17" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">424 km</text>
          
          <!-- Price Est -->
          <text x="142" y="18" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1FA34C">₹300<tspan font-weight="500" font-size="12" fill="#8C8A82">/hr</tspan></text>
        </g>
        
        <!-- Next Icon -->
        <path d="M9 18l6-6-6-6" fill="none" stroke="#E7E5DF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(305, 50)" />
      </g>

      <!-- Worker Card 2 -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="343" height="124" rx="20" fill="#FFFFFF" filter="url(#v2wl-card-shadow)" />
        
        <g transform="translate(16, 16)"><clipPath id="v2wl-avatar-clip-2"><rect width="60" height="60" rx="30"/></clipPath><image href="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&amp;h=150&amp;fit=crop" width="60" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#v2wl-avatar-clip-2)" /></g>
        
        <text x="96" y="34" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#1A1A18">Ravi Kumar</text>
        <text x="96" y="54" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#5B5A54">Pipe Fitting Specialist</text>
        
        <g transform="translate(96, 68)">
          <rect x="0" y="0" width="58" height="26" rx="8" fill="#FFFBEB" />
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="#F59E0B" transform="translate(4, 5) scale(0.6)" />
          <text x="24" y="17" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400E">4.6</text>
          
          <rect x="66" y="0" width="58" height="26" rx="8" fill="#F3F4F6" />
          <text x="95" y="17" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">5.1 km</text>
          
          <text x="132" y="18" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1FA34C">₹250<tspan font-weight="500" font-size="12" fill="#8C8A82">/hr</tspan></text>
        </g>
      </g>
      
      <!-- Worker Card 3 -->
      <g transform="translate(0, 280)">
        <rect x="0" y="0" width="343" height="124" rx="20" fill="#FFFFFF" filter="url(#v2wl-card-shadow)" />
        
        <g transform="translate(16, 16)"><clipPath id="v2wl-avatar-clip-3"><rect width="60" height="60" rx="30"/></clipPath><image href="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150&amp;h=150&amp;fit=crop" width="60" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#v2wl-avatar-clip-3)" /></g>
        <!-- Verification Badge -->
        <circle cx="76" cy="86" r="10" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" transform="translate(-20, -20)" />
        <path d="M4 8l2 2 4-4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(51, 61) scale(0.8)" />

        <text x="96" y="34" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#1A1A18">Amit Sharma</text>
        <text x="96" y="54" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#5B5A54">General Plumbing</text>
        
        <g transform="translate(96, 68)">
          <rect x="0" y="0" width="58" height="26" rx="8" fill="#FFFBEB" />
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="#F59E0B" transform="translate(4, 5) scale(0.6)" />
          <text x="24" y="17" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400E">4.9</text>
          
          <rect x="66" y="0" width="58" height="26" rx="8" fill="#F3F4F6" />
          <text x="95" y="17" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">8.2 km</text>
          
          <text x="132" y="18" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1FA34C">₹400<tspan font-weight="500" font-size="12" fill="#8C8A82">/hr</tspan></text>
        </g>
      </g>
    </g>

    </g><!-- End Scrollable Body -->

    <!-- Bottom Navigation -->
    <g transform="translate(20, 748)">
      <rect x="0" y="0" width="375" height="84" fill="#FFFFFF" />
      <line x1="0" y1="0" x2="375" y2="0" stroke="#E7E5DF" stroke-width="1" />
      
      <!-- Home -->
      <g transform="translate(72, 14)">
        <g fill="none" stroke="#1A1A18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" />
        </g>
        <text x="12" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1A1A18" text-anchor="middle">Home</text>
      </g>
      
      <!-- Store -->
      <g transform="translate(175.5, 14)">
        <g fill="none" stroke="#8C8A82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/>
        </g>
        <text x="12" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#8C8A82" text-anchor="middle">Store</text>
      </g>
      
      <!-- Profile -->
      <g transform="translate(279, 14)">
        <g fill="none" stroke="#8C8A82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </g>
        <text x="12" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#8C8A82" text-anchor="middle">Profile</text>
      </g>
      
      <rect x="127" y="70" width="120" height="5" rx="2.5" fill="#1A1A18" />
    </g>
  </g>
</svg>

