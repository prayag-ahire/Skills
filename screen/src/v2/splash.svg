<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 852" width="100%" height="100%">
  <defs>
    <filter id="v2s-device-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <clipPath id="v2s-screen-clip">
      <rect x="20" y="20" width="375" height="812" rx="40" />
    </clipPath>
  </defs>
  
  <!-- Hardware -->
  <rect x="10" y="10" width="395" height="832" rx="50" fill="#111111" filter="url(#v2s-device-shadow)" />
  <rect x="20" y="20" width="375" height="812" rx="40" fill="#FFFFFF" />
  
  <path d="M8 150 h2 v24 h-2 z" fill="#333333" />
  <path d="M8 190 h2 v48 h-2 z" fill="#333333" />
  <path d="M8 250 h2 v48 h-2 z" fill="#333333" />
  <path d="M405 220 h2 v72 h-2 z" fill="#333333" />

  <!-- Screen Content -->
  <g clip-path="url(#v2s-screen-clip)">
    <rect x="20" y="20" width="375" height="812" fill="#FFFFFF" />
    
    <!-- Status Bar -->
    <g transform="translate(20, 20)">
      <text x="32" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#111827" font-size="15" font-weight="600" text-anchor="middle">14:47</text>
      <!-- Battery, Wifi etc -->
      <g transform="translate(290, 17)" fill="#111827">
        <g transform="translate(0, 0)">
          <rect x="0" y="8" width="3" height="4" rx="1" />
          <rect x="4" y="6" width="3" height="6" rx="1" />
          <rect x="8" y="4" width="3" height="8" rx="1" />
          <rect x="12" y="2" width="3" height="10" rx="1" />
        </g>
        <g transform="translate(20, 0)">
          <path d="M8 12.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" />
          <path d="M3.5 8C6.1 5.4 9.9 5.4 12.5 8l-1.5 1.5C9.4 7.9 6.6 7.9 5 9.5L3.5 8z" />
          <path d="M0.5 5C4.7 1.2 11.3 1.2 15.5 5l-1.5 1.5c-3.4-3-8.6-3-12 0L0.5 5z" />
        </g>
        <g transform="translate(42, 1)">
          <rect x="0" y="0" width="22" height="11" rx="3.5" fill="none" stroke="#111827" stroke-width="1.2" />
          <rect x="2" y="2" width="15" height="7" rx="2" />
          <path d="M23.5 3.5v4" stroke="#111827" stroke-width="1.5" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- Center Logo -->
    <g transform="translate(207.5, 420)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" text-anchor="middle">
        <tspan fill="#2563EB">Pro</tspan><tspan fill="#111827">Worker</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <text x="207.5" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#6B7280" font-size="16" font-weight="400" text-anchor="middle">Find professional workers near you</text>
    
    <!-- Loading dot -->
    <circle cx="207.5" cy="730" r="3" fill="#2563EB" />
    
    <!-- Version -->
    <text x="207.5" y="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#9CA3AF" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1">v1.0.0</text>
    
    <!-- iOS Home Indicator -->
    <rect x="147" y="815" width="120" height="5" rx="2.5" fill="#1A1A18" />
  </g>
</svg>
