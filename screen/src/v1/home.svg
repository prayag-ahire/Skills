<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 852" width="100%" height="100%" role="img" aria-labelledby="title desc">
      <title id="title">ProWorker App Interface</title>
      <desc id="desc">A refined mobile UI for the ProWorker application, featuring a search bar, category grid, and horizontal scrolling cards.</desc>
      
      <defs>
        <!-- Screen Clip -->
        <clipPath id="v1h-screen-clip">
          <rect x="20" y="20" width="375" height="812" rx="40" />
        </clipPath>
        
        <!-- Shadows -->
        <filter id="v1h-shadow-resting" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#141410" flood-opacity="0.06" />
        </filter>

        <!-- Icons (Lucide) -->
        <g id="icon-bell" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </g>
        <g id="icon-search" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </g>
        <g id="icon-filter" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" x2="14" y1="4" y2="4" />
          <line x1="10" x2="3" y1="4" y2="4" />
          <line x1="21" x2="12" y1="12" y2="12" />
          <line x1="8" x2="3" y1="12" y2="12" />
          <line x1="21" x2="16" y1="20" y2="20" />
          <line x1="12" x2="3" y1="20" y2="20" />
          <line x1="14" x2="14" y1="2" y2="6" />
          <line x1="8" x2="8" y1="10" y2="14" />
          <line x1="16" x2="16" y1="18" y2="22" />
        </g>
        <g id="icon-navigation" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11" />
        </g>
        <g id="icon-chevron-down" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </g>
        
        <!-- Category Icons -->
        <g id="icon-plumber" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </g>
        <g id="icon-electrician" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>
        </g>
        <g id="icon-carpenter" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-6-6-9.37-4-9.37-4l2.5 2.5a5.53 5.53 0 0 0 2.22-1l.73-.73c.4-.4.81-1.07 1.34-1.34l-2.78-2.78a2.12 2.12 0 0 1 3-3l1.25 1.25c4 0 2 3.37 2 3.37L15 2.36"/>
        </g>
        <g id="icon-painter" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="16" height="6" rx="2"/><path d="M10 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 0 2-2V7"/><rect x="8" y="16" width="4" height="6" rx="1"/>
        </g>
        <g id="icon-ac" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/>
        </g>
        <g id="icon-cleaning" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 17v4"/><path d="M17 19h4"/>
        </g>
        <g id="icon-barber" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>
        </g>
        <g id="icon-tutor" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </g>
        <g id="icon-leaf" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </g>
        <g id="icon-home" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </g>
        <g id="icon-store" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/>
        </g>
        <g id="icon-user" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </g>
      </defs>

      <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .text-primary { fill: #1A1A18; }
        .text-secondary { fill: #5B5A54; }
        .text-muted { fill: #8C8A82; }
        .text-accent { fill: #3B82F6; }
      </style>

      <!-- Device Frame -->
      <!-- Device Frame (Thicker bezel) -->
      <!-- Shadow applied directly to the device -->
      <filter id="v1h-device-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.15" />
      </filter>
      
      <rect x="10" y="10" width="395" height="832" rx="50" fill="#111111" filter="url(#v1h-device-shadow)" />
      <rect x="20" y="20" width="375" height="812" rx="40" fill="#F7F7F5" />
      
      <!-- Buttons on Device Frame -->
      <path d="M8 150 h2 v24 h-2 z" fill="#333333" />
      <path d="M8 190 h2 v48 h-2 z" fill="#333333" />
      <path d="M8 250 h2 v48 h-2 z" fill="#333333" />
      <path d="M405 220 h2 v72 h-2 z" fill="#333333" />

      <!-- Screen Content -->
      <g clip-path="url(#v1h-screen-clip)">
        <!-- Background -->
        <rect x="20" y="20" width="375" height="812" fill="#F7F7F5" />
        
        <!-- Status Bar (iPhone style) -->
        <g transform="translate(20, 20)">
          <text x="32" y="32" class="font-sans text-primary" font-size="15" font-weight="600" text-anchor="middle">14:47</text>
          <rect x="126" y="11" width="123" height="35" rx="17.5" fill="#000000" />
          <g transform="translate(290, 17)" fill="#1A1A18">
            <!-- Cellular -->
            <g transform="translate(0, 0)">
              <rect x="0" y="8" width="3" height="4" rx="1" />
              <rect x="4" y="6" width="3" height="6" rx="1" />
              <rect x="8" y="4" width="3" height="8" rx="1" />
              <rect x="12" y="2" width="3" height="10" rx="1" />
            </g>
            <!-- Wifi -->
            <g transform="translate(20, 0)">
              <path d="M8 12.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" />
              <path d="M3.5 8C6.1 5.4 9.9 5.4 12.5 8l-1.5 1.5C9.4 7.9 6.6 7.9 5 9.5L3.5 8z" />
              <path d="M0.5 5C4.7 1.2 11.3 1.2 15.5 5l-1.5 1.5c-3.4-3-8.6-3-12 0L0.5 5z" />
            </g>
            <!-- Battery -->
            <g transform="translate(42, 1)">
              <rect x="0" y="0" width="22" height="11" rx="3.5" fill="none" stroke="#1A1A18" stroke-width="1.2" />
              <rect x="2" y="2" width="15" height="7" rx="2" />
              <path d="M23.5 3.5v4" stroke="#1A1A18" stroke-width="1.5" stroke-linecap="round" />
            </g>
          </g>
        </g>

        <!-- Header -->
        <g transform="translate(44, 100)">
          <text class="font-sans text-accent" font-size="28" font-weight="800" letter-spacing="-0.5">Pro<tspan class="text-primary">Worker</tspan></text>
          <use href="#icon-bell" x="303" y="-22" width="24" height="24" class="text-primary" />
          <circle cx="323" cy="-20" r="4" fill="#3B82F6" stroke="#F7F7F5" stroke-width="1.5" />
        </g>

        <!-- Search & Filter -->
        <g transform="translate(44, 150)">
          <rect x="0" y="0" width="267" height="48" rx="14" fill="#FFFFFF" filter="url(#v1h-shadow-resting)" />
          <use href="#icon-search" x="16" y="14" width="20" height="20" class="text-secondary" />
          <text x="48" y="29" class="font-sans text-muted" font-size="15" font-weight="400">Need quick help? Search here...</text>
          <rect x="279" y="0" width="48" height="48" rx="14" fill="#FFFFFF" filter="url(#v1h-shadow-resting)" />
          <use href="#icon-filter" x="291" y="14" width="20" height="20" class="text-primary" />
        </g>

        <!-- Location -->
        <g transform="translate(44, 220)">
          <rect x="0" y="0" width="327" height="60" rx="16" fill="#FFFFFF" filter="url(#v1h-shadow-resting)" />
          <rect x="12" y="12" width="36" height="36" rx="18" fill="#EFF6FF" />
          <use href="#icon-navigation" x="20" y="20" width="18" height="18" class="text-accent" />
          <text x="60" y="28" class="font-sans text-muted" font-size="12" font-weight="500">Search near</text>
          <text x="60" y="46" class="font-sans text-primary" font-size="14" font-weight="600">Home2 · Prahlad Nagar Road...</text>
          <use href="#icon-chevron-down" x="291" y="20" width="20" height="20" class="text-muted" />
        </g>

        <!-- Headings -->
        <text x="44" y="316" class="font-sans text-primary" font-size="24" font-weight="700">What are you looking for?</text>
        <text x="44" y="354" class="font-sans text-secondary" font-size="16" font-weight="600">Popular</text>

        <!-- Grid -->
        <g transform="translate(44, 374)">
          <g id="plumber-category-btn-old" transform="translate(0, 0)" style="cursor: pointer;">
            <rect x="0" y="0" width="70" height="70" rx="20" fill="#E8F6EC" />
            <use href="#icon-plumber" x="23" y="23" width="24" height="24" stroke="#1FA34C" />
            <text x="35" y="88" class="font-sans text-primary" font-size="12" font-weight="600" text-anchor="middle">Plumber</text>
          </g>
          <g transform="translate(85.6, 0)">
            <rect x="0" y="0" width="70" height="70" rx="20" fill="#F1ECFB" />
            <use href="#icon-electrician" x="23" y="23" width="24" height="24" stroke="#7B3FE4" />
            <text x="35" y="88" class="font-sans text-primary" font-size="12" font-weight="600" text-anchor="middle">Electrician</text>
          </g>
          <g transform="translate(171.3, 0)">
            <rect x="0" y="0" width="70" height="70" rx="20" fill="#FFF0E6" />
            <use href="#icon-carpenter" x="23" y="23" width="24" height="24" stroke="#FF7A1A" />
            <text x="35" y="88" class="font-sans text-primary" font-size="12" font-weight="600" text-anchor="middle">Carpenter</text>
          </g>
          <g transform="translate(257, 0)">
            <rect x="0" y="0" width="70" height="70" rx="20" fill="#FCEAF1" />
            <use href="#icon-painter" x="23" y="23" width="24" height="24" stroke="#E43F7F" />
            <text x="35" y="88" class="font-sans text-primary" font-size="12" font-weight="600" text-anchor="middle">Painter</text>
          </g>
          <g transform="translate(0, 114)">
            <rect x="0" y="0" width="70" height="70" rx="20" fill="#EFF6FF" />
            <use href="#icon-ac" x="23" y="23" width="24" height="24" stroke="#3B82F6" />
            <text x="35" y="88" class="font-sans text-primary" font-size="12" font-weight="600" text-anchor="middle">AC Tech</text>
          </g>
          <g transform="translate(85.6, 114)">
            <rect x="0" y="0" width="70" height="70" rx="20" fill="#E8F6EC" />
            <use href="#icon-cleaning" x="23" y="23" width="24" height="24" stroke="#1FA34C" />
            <text x="35" y="88" class="font-sans text-primary" font-size="12" font-weight="600" text-anchor="middle">Cleaning</text>
          </g>
          <g transform="translate(171.3, 114)">
            <rect x="0" y="0" width="70" height="70" rx="20" fill="#F1ECFB" />
            <use href="#icon-barber" x="23" y="23" width="24" height="24" stroke="#7B3FE4" />
            <text x="35" y="88" class="font-sans text-primary" font-size="12" font-weight="600" text-anchor="middle">Barber</text>
          </g>
          <g transform="translate(257, 114)">
            <rect x="0" y="0" width="70" height="70" rx="20" fill="#FFF0E6" />
            <use href="#icon-tutor" x="23" y="23" width="24" height="24" stroke="#FF7A1A" />
            <text x="35" y="88" class="font-sans text-primary" font-size="12" font-weight="600" text-anchor="middle">Home Tutor</text>
          </g>
        </g>

        <text x="44" y="628" class="font-sans text-secondary" font-size="16" font-weight="600">Categories</text>

        <!-- Cards -->
        <g transform="translate(44, 648)">
          <g id="popular-plumber-card-old" style="cursor: pointer;"><rect x="0" y="0" width="156" height="96" rx="20" fill="#EFF6FF" filter="url(#v1h-shadow-resting)" />
            <circle cx="36" cy="36" r="20" fill="#FFFFFF" />
            <use href="#icon-plumber" x="26" y="26" width="20" height="20" stroke="#3B82F6" />
            <text x="20" y="78" class="font-sans text-primary" font-size="15" font-weight="700">Home &amp; Repair</text>
          </g>
          <g transform="translate(170, 0)">
            <rect x="0" y="0" width="156" height="96" rx="20" fill="#E8F6EC" filter="url(#v1h-shadow-resting)" />
            <circle cx="36" cy="36" r="20" fill="#FFFFFF" />
            <use href="#icon-leaf" x="26" y="26" width="20" height="20" stroke="#1FA34C" />
            <text x="20" y="78" class="font-sans text-primary" font-size="15" font-weight="700">Beauty &amp; Spa</text>
          </g>
          <g transform="translate(340, 0)">
            <rect x="0" y="0" width="156" height="96" rx="20" fill="#F1ECFB" filter="url(#v1h-shadow-resting)" />
            <circle cx="36" cy="36" r="20" fill="#FFFFFF" />
            <use href="#icon-store" x="26" y="26" width="20" height="20" stroke="#7B3FE4" />
            <text x="20" y="78" class="font-sans text-primary" font-size="15" font-weight="700">Retailers</text>
          </g>
        </g>

        <!-- Bottom Tab Bar -->
        <g transform="translate(20, 748)">
          <rect x="0" y="0" width="375" height="84" fill="#FFFFFF" />
          <line x1="0" y1="0" x2="375" y2="0" stroke="#E7E5DF" stroke-width="1" />
          <g transform="translate(72, 14)">
            <use href="#icon-home" x="0" y="0" width="24" height="24" stroke="#3B82F6" stroke-width="2.5" />
            <text x="12" y="36" class="font-sans text-accent" font-size="11" font-weight="600" text-anchor="middle">Home</text>
          </g>
          <g transform="translate(175.5, 14)">
            <use href="#icon-store" x="0" y="0" width="24" height="24" class="text-secondary" />
            <text x="12" y="36" class="font-sans text-secondary" font-size="11" font-weight="500" text-anchor="middle">Store</text>
          </g>
          <g transform="translate(279, 14)">
            <use href="#icon-user" x="0" y="0" width="24" height="24" class="text-secondary" />
            <text x="12" y="36" class="font-sans text-secondary" font-size="11" font-weight="500" text-anchor="middle">Profile</text>
          </g>
          <rect x="127" y="70" width="120" height="5" rx="2.5" fill="#1A1A18" />
        </g>
        
        
        </g>

      </g>
    </svg>
